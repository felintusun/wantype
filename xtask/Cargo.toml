[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Project chores (`cargo xtask <task>`).
[dependencies]
thiserror = "2"
wantype-core = { path = "../core" }
serde = "1"
serde_json = "1"
# Tatoeba's exports: HTTPS downloads, bzip2 (pure Rust by default).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
bzip2 = "0.6"
# The CSP's script hashes.
sha2 = "0.11"
base64 = "0.23"
# The PNG icons, rendered from the SVG (no text or images in it).
resvg = { version = "0.48.1", default-features = false }
# Its encoder's error type (tiny-skia's dependency).
png = { version = "0.18.1", default-features = false }
