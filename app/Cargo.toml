[package]
name = "wantype"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2"
# Client-side rendering only: the app is a static site, no server.
leptos = { version = "0.8.22", features = ["csr"] }
wantype-core = { path = "../core" }
js-sys = "0.3"
# Shared futures for the data cache (already in the tree through Leptos).
futures = "0.3"
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"

[dependencies.web-sys]
version = "0.3"
features = [
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "FontFaceSet",
    "HtmlAudioElement",
    "HtmlElement",
    "HtmlMediaElement",
    "HtmlSourceElement",
    "KeyboardEvent",
    "MediaQueryList",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "PointerEvent",
    "RequestCache",
    "RequestInit",
    "Response",
    "Storage",
    "Window",
]
